name: Deploy Next.js preview
description: Builds and deploys the OpenNext artifact using the platform Terraform.

inputs:
  app-directory:
    description: Application directory relative to the checkout root.
    required: true
  app-slug:
    description: Unique lowercase application identifier.
    required: true
  pr-number:
    description: Pull request number.
    required: true
  aws-region:
    description: AWS deployment region.
    required: true
  aws-role-arn:
    description: GitHub OIDC deployment role ARN.
    required: true

outputs:
  preview-url:
    description: CloudFront URL of the deployed preview.
    value: ${{ steps.deploy.outputs.preview-url }}

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.10.5

    - name: Deploy preview
      id: deploy
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        APP_DIRECTORY: ${{ inputs.app-directory }}
        APP_SLUG: ${{ inputs.app-slug }}
        PR_NUMBER: ${{ inputs.pr-number }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        set -euo pipefail

        terraform_root=$(realpath "$ACTION_PATH/../../../infra")
        app_root=$(realpath "$GITHUB_WORKSPACE/$APP_DIRECTORY")
        build_path="$app_root/.open-next"

        if [[ "$APP_SLUG" == "deploy-aws" ]]; then
          workspace="pr-${PR_NUMBER}"
        else
          workspace="${APP_SLUG}-pr-${PR_NUMBER}"
        fi

        export TF_IN_AUTOMATION=true
        export TF_INPUT=false
        export TF_VAR_app_slug="$APP_SLUG"
        export TF_VAR_aws_region="$AWS_REGION"
        export TF_VAR_pr_number="$PR_NUMBER"
        export TF_VAR_opennext_build_path="$build_path"

        terraform -chdir="$terraform_root" fmt -check -recursive
        terraform -chdir="$terraform_root" init -backend=false -input=false
        terraform -chdir="$terraform_root" validate
        terraform -chdir="$terraform_root" test
        terraform -chdir="$terraform_root" init -reconfigure -input=false

        terraform -chdir="$terraform_root" workspace select "$workspace" \
          || terraform -chdir="$terraform_root" workspace new "$workspace"

        terraform -chdir="$terraform_root" plan -out="$RUNNER_TEMP/preview.tfplan"
        terraform -chdir="$terraform_root" apply "$RUNNER_TEMP/preview.tfplan"

        preview_url=$(terraform -chdir="$terraform_root" output -raw preview_url)
        distribution_id=$(terraform -chdir="$terraform_root" output -raw cloudfront_distribution_id)
        invalidation_id=$(aws cloudfront create-invalidation \
          --distribution-id "$distribution_id" \
          --paths '/*' \
          --query 'Invalidation.Id' \
          --output text)
        aws cloudfront wait invalidation-completed \
          --distribution-id "$distribution_id" \
          --id "$invalidation_id"

        echo "preview-url=$preview_url" >> "$GITHUB_OUTPUT"