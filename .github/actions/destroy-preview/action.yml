name: Destroy Next.js preview
description: Destroys an application preview using the platform Terraform.

inputs:
  app-directory:
    description: Application directory relative to the checkout root.
    required: true
  app-slug:
    description: Unique lowercase application identifier.
    required: true
  pr-number:
    description: Pull request number.
    required: true
  aws-region:
    description: AWS deployment region.
    required: true
  aws-role-arn:
    description: GitHub OIDC deployment role ARN.
    required: true

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.10.5

    - name: Destroy preview
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        APP_DIRECTORY: ${{ inputs.app-directory }}
        APP_SLUG: ${{ inputs.app-slug }}
        PR_NUMBER: ${{ inputs.pr-number }}
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        set -euo pipefail

        terraform_root=$(realpath "$ACTION_PATH/../../../infra")
        app_root=$(realpath "$GITHUB_WORKSPACE/$APP_DIRECTORY")

        if [[ "$APP_SLUG" == "deploy-aws" ]]; then
          workspace="pr-${PR_NUMBER}"
        else
          workspace="${APP_SLUG}-pr-${PR_NUMBER}"
        fi

        export TF_IN_AUTOMATION=true
        export TF_INPUT=false
        export TF_VAR_app_slug="$APP_SLUG"
        export TF_VAR_aws_region="$AWS_REGION"
        export TF_VAR_pr_number="$PR_NUMBER"
        export TF_VAR_opennext_build_path="$app_root/.open-next"

        terraform -chdir="$terraform_root" init -reconfigure -input=false
        if terraform -chdir="$terraform_root" workspace select "$workspace"; then
          terraform -chdir="$terraform_root" destroy -auto-approve -var="deploy_artifacts=false"
          terraform -chdir="$terraform_root" workspace select default
          terraform -chdir="$terraform_root" workspace delete "$workspace"
        else
          echo "No Terraform workspace found for ${APP_SLUG} PR ${PR_NUMBER}; nothing to destroy."
        fi