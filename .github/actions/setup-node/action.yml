name: Setup Node.js
description: Sets up Node.js and installs application dependencies.

inputs:
  app-directory:
    description: Application directory relative to the checkout root.
    required: true
  node-version:
    description: Node.js version.
    required: true
  install-command:
    description: Dependency installation command.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.app-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.app-directory }}
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: bash -euo pipefail -c "$INSTALL_COMMAND"