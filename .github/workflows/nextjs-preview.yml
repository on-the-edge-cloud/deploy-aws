name: Next.js preview platform

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to nextjs-app.ts in the application repository.
        required: true
        type: string
      command:
        description: Preview operation, either deploy or destroy.
        required: true
        type: string
      platform-ref:
        description: Branch or tag of the platform repository to use.
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        description: AWS role assumed through GitHub OIDC.
        required: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Checkout platform Terraform and actions
        uses: actions/checkout@v4
        with:
          repository: on-the-edge-cloud/deploy-aws
          ref: ${{ inputs.platform-ref }}
          path: .platform

      - name: Read application configuration
        id: config
        uses: ./.platform/.github/actions/read-config
        with:
          config-path: ${{ inputs.config-path }}
          command: ${{ inputs.command }}

      - name: Setup Node.js
        if: inputs.command == 'deploy'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.config.outputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ steps.config.outputs.app-directory }}/package-lock.json

      - name: Install dependencies
        if: inputs.command == 'deploy'
        shell: bash
        working-directory: ${{ steps.config.outputs.app-directory }}
        env:
          INSTALL_COMMAND: ${{ steps.config.outputs.install-command }}
        run: bash -euo pipefail -c "$INSTALL_COMMAND"

      - name: Lint
        if: inputs.command == 'deploy' && steps.config.outputs.lint-command != ''
        shell: bash
        working-directory: ${{ steps.config.outputs.app-directory }}
        env:
          LINT_COMMAND: ${{ steps.config.outputs.lint-command }}
        run: bash -euo pipefail -c "$LINT_COMMAND"

      - name: Test application
        if: inputs.command == 'deploy' && steps.config.outputs.test-command != ''
        shell: bash
        working-directory: ${{ steps.config.outputs.app-directory }}
        env:
          TEST_COMMAND: ${{ steps.config.outputs.test-command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"

      - name: Build Next.js
        if: inputs.command == 'deploy' && steps.config.outputs.build-command != ''
        shell: bash
        working-directory: ${{ steps.config.outputs.app-directory }}
        env:
          BUILD_COMMAND: ${{ steps.config.outputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      - name: Build OpenNext
        if: inputs.command == 'deploy'
        shell: bash
        working-directory: ${{ steps.config.outputs.app-directory }}
        env:
          OPENNEXT_BUILD_COMMAND: ${{ steps.config.outputs.opennext-build-command }}
        run: bash -euo pipefail -c "$OPENNEXT_BUILD_COMMAND"

      - name: Configure AWS credentials
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.config.outputs.aws-region }}

      - name: Setup Terraform
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Prepare Terraform variables
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        shell: bash
        env:
          APP_DIRECTORY: ${{ steps.config.outputs.app-directory }}
          APP_SLUG: ${{ steps.config.outputs.app-slug }}
          AWS_REGION: ${{ steps.config.outputs.aws-region }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          app_root=$(realpath "$GITHUB_WORKSPACE/$APP_DIRECTORY")
          if [[ "$APP_SLUG" == "deploy-aws" ]]; then
            workspace="pr-${PR_NUMBER}"
          else
            workspace="${APP_SLUG}-pr-${PR_NUMBER}"
          fi

          {
            echo "TERRAFORM_ROOT=$GITHUB_WORKSPACE/.platform/infra"
            echo "TF_IN_AUTOMATION=true"
            echo "TF_INPUT=false"
            echo "TF_VAR_app_slug=$APP_SLUG"
            echo "TF_VAR_aws_region=$AWS_REGION"
            echo "TF_VAR_pr_number=$PR_NUMBER"
            echo "TF_VAR_opennext_build_path=$app_root/.open-next"
            echo "PREVIEW_WORKSPACE=$workspace"
          } >> "$GITHUB_ENV"

      - name: Format Terraform
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        run: terraform -chdir="$TERRAFORM_ROOT" fmt -check -recursive

      - name: Initialize Terraform without backend
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        run: terraform -chdir="$TERRAFORM_ROOT" init -backend=false -input=false

      - name: Validate Terraform
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        run: terraform -chdir="$TERRAFORM_ROOT" validate

      - name: Initialize Terraform backend
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        run: terraform -chdir="$TERRAFORM_ROOT" init -reconfigure -input=false

      - name: Select or create preview workspace
        id: workspace
        if: inputs.command == 'deploy' || inputs.command == 'destroy'
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          if [[ "$COMMAND" == "deploy" ]]; then
            terraform -chdir="$TERRAFORM_ROOT" workspace select "$PREVIEW_WORKSPACE" \
              || terraform -chdir="$TERRAFORM_ROOT" workspace new "$PREVIEW_WORKSPACE"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif terraform -chdir="$TERRAFORM_ROOT" workspace select "$PREVIEW_WORKSPACE"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan preview
        if: inputs.command == 'deploy'
        run: terraform -chdir="$TERRAFORM_ROOT" plan -out="$RUNNER_TEMP/preview.tfplan"

      - name: Deploy preview
        if: inputs.command == 'deploy'
        run: terraform -chdir="$TERRAFORM_ROOT" apply "$RUNNER_TEMP/preview.tfplan"

      - name: Read preview URL and CloudFront distribution
        id: preview
        if: inputs.command == 'deploy'
        shell: bash
        run: |
          echo "preview-url=$(terraform -chdir="$TERRAFORM_ROOT" output -raw preview_url)" >> "$GITHUB_OUTPUT"
          echo "distribution-id=$(terraform -chdir="$TERRAFORM_ROOT" output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Create CloudFront invalidation
        id: invalidation
        if: inputs.command == 'deploy'
        env:
          DISTRIBUTION_ID: ${{ steps.preview.outputs.distribution-id }}
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)
          echo "id=$invalidation_id" >> "$GITHUB_OUTPUT"

      - name: Wait for CloudFront invalidation
        if: inputs.command == 'deploy'
        env:
          DISTRIBUTION_ID: ${{ steps.preview.outputs.distribution-id }}
          INVALIDATION_ID: ${{ steps.invalidation.outputs.id }}
        run: aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$INVALIDATION_ID"

      - name: Smoke test preview
        if: inputs.command == 'deploy' && steps.config.outputs.smoke-test-command != ''
        shell: bash
        working-directory: ${{ steps.config.outputs.app-directory }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          SMOKE_TEST_COMMAND: ${{ steps.config.outputs.smoke-test-command }}
        run: bash -euo pipefail -c "$SMOKE_TEST_COMMAND"

      - name: Comment preview URL
        if: inputs.command == 'deploy'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const body = `Preview listo: ${process.env.PREVIEW_URL}`;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(comment =>
              comment.user.type === 'Bot' && comment.body.startsWith('Preview listo: https://')
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Destroy preview
        if: inputs.command == 'destroy' && steps.workspace.outputs.exists == 'true'
        run: terraform -chdir="$TERRAFORM_ROOT" destroy -auto-approve -var="deploy_artifacts=false"

      - name: Select default workspace
        if: inputs.command == 'destroy' && steps.workspace.outputs.exists == 'true'
        run: terraform -chdir="$TERRAFORM_ROOT" workspace select default

      - name: Delete preview workspace
        if: inputs.command == 'destroy' && steps.workspace.outputs.exists == 'true'
        run: terraform -chdir="$TERRAFORM_ROOT" workspace delete "$PREVIEW_WORKSPACE"

      - name: Report missing preview workspace
        if: inputs.command == 'destroy' && steps.workspace.outputs.exists != 'true'
        run: echo "No Terraform workspace found for this preview; nothing to destroy."