name: Preview environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: eu-north-1
  AWS_ROLE_ARN: arn:aws:iam::191926569765:role/github-actions-nextjs-preview

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm

      - name: Debug OIDC subject
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString('utf8')
            );

            core.setOutput('subject', payload.sub);
            console.log(`OIDC subject: ${payload.sub}`);

      - name: Show subject
        run: echo "SUB=${{ steps.oidc.outputs.subject }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Build Next.js
        if: github.event.action != 'closed'
        run: |
          npm ci
          npm run build

      - name: Deploy preview
        if: github.event.action != 'closed'
        id: deploy
        working-directory: infra
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          terraform init
          terraform workspace select "pr-${PR_NUMBER}" || terraform workspace new "pr-${PR_NUMBER}"
          terraform apply -auto-approve -var="pr_number=${PR_NUMBER}"
          echo "preview-url=$(terraform output -raw preview_url)" >> "$GITHUB_OUTPUT"
          echo "s3-bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "cloudfront-id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Upload static assets
        if: github.event.action != 'closed'
        env:
          S3_BUCKET: ${{ steps.deploy.outputs.s3-bucket }}
        run: aws s3 sync out/ "s3://${S3_BUCKET}" --delete

      - name: Invalidate CloudFront
        if: github.event.action != 'closed'
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ steps.deploy.outputs.cloudfront-id }}
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths '/*'

      - name: Comment preview URL
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const body = `Preview listo: ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(comment =>
              comment.user.type === 'Bot' && comment.body.startsWith('Preview listo: https://')
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}

      - name: Destroy preview
        if: github.event.action == 'closed'
        working-directory: infra
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          terraform init
          if terraform workspace select "pr-${PR_NUMBER}"; then
            terraform destroy -auto-approve -var="pr_number=${PR_NUMBER}"
            terraform workspace select default
            terraform workspace delete "pr-${PR_NUMBER}"
          else
            echo "No Terraform workspace found for PR ${PR_NUMBER}; nothing to destroy."
          fi