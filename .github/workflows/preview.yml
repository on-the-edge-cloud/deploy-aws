name: Preview environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: eu-north-1

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_pr_number: ${{ github.event.pull_request.number }}
      TF_VAR_aws_region: eu-north-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Build Next.js and OpenNext
        if: github.event.action != 'closed'
        run: |
          npm ci
          npm run lint
          npm run opennext:build

      - name: Validate Terraform
        if: github.event.action != 'closed'
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate
          terraform test

      - name: Deploy preview
        if: github.event.action != 'closed'
        id: deploy
        working-directory: infra
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          terraform init -reconfigure
          terraform workspace select "pr-${PR_NUMBER}" || terraform workspace new "pr-${PR_NUMBER}"
          terraform plan -out=tfplan
          terraform apply tfplan
          echo "preview-url=$(terraform output -raw preview_url)" >> "$GITHUB_OUTPUT"
          echo "s3-bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "cloudfront-id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront
        if: github.event.action != 'closed'
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ steps.deploy.outputs.cloudfront-id }}
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths '/*' --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --id "$INVALIDATION_ID"

      - name: Smoke test preview
        if: github.event.action != 'closed'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
        run: npm run test:smoke -- "$PREVIEW_URL"

      - name: Comment preview URL
        if: github.event.action != 'closed'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const body = `Preview listo: ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(comment =>
              comment.user.type === 'Bot' && comment.body.startsWith('Preview listo: https://')
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}

      - name: Destroy preview
        if: github.event.action == 'closed'
        working-directory: infra
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          terraform init
          if terraform workspace select "pr-${PR_NUMBER}"; then
            S3_BUCKET=$(terraform output -raw s3_bucket_name)
            bash ../scripts/empty-versioned-preview-bucket.sh "$S3_BUCKET" "$PR_NUMBER"
            terraform destroy -auto-approve -var="deploy_artifacts=false"
            terraform workspace select default
            terraform workspace delete "pr-${PR_NUMBER}"
          else
            echo "No Terraform workspace found for PR ${PR_NUMBER}; nothing to destroy."
          fi